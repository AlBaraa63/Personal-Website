<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="1" fill="#00ff41" fill-opacity="0.03"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <g stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- CCTV camera -->
  <g filter="url(#glow)" stroke="#00ff41" fill="none" stroke-width="1.5">
    <rect x="330" y="110" width="70" height="34" rx="6" fill="#00ff41" fill-opacity="0.08"/>
    <circle cx="345" cy="127" r="8" fill="none" stroke-width="1.5"/>
    <circle cx="345" cy="127" r="3" fill="#00ff41" fill-opacity="0.7" stroke="none"/>
    <line x1="330" y1="127" x2="310" y2="127" stroke-width="3"/>
  </g>

  <!-- Viewing frustum -->
  <polygon points="345,144 250,290 440,290" fill="#00ff41" fill-opacity="0.04" stroke="#00ff41" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Person silhouette -->
  <g transform="translate(345,300)" filter="url(#glow)" fill="#00ff41" fill-opacity="0.16" stroke="#00ff41" stroke-width="1.5">
    <circle cx="0" cy="-58" r="14"/>
    <path d="M-20,-38 Q0,-50 20,-38 L24,20 Q0,30 -24,20 Z"/>
    <line x1="-20" y1="-25" x2="-34" y2="5" stroke-width="4" stroke-linecap="round" fill="none"/>
    <line x1="20" y1="-25" x2="34" y2="5" stroke-width="4" stroke-linecap="round" fill="none"/>
    <line x1="-10" y1="20" x2="-14" y2="60" stroke-width="5" stroke-linecap="round" fill="none"/>
    <line x1="10" y1="20" x2="14" y2="60" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Detection bounding box + alert -->
  <g stroke="#ef4444" fill="none" stroke-opacity="0.9" stroke-width="1.5">
    <polyline points="295,225 295,210 310,210"/>
    <polyline points="380,210 395,210 395,225"/>
    <polyline points="295,378 295,393 310,393"/>
    <polyline points="380,393 395,393 395,378"/>
  </g>
  <rect x="295" y="215" width="100" height="14" fill="#ef4444" fill-opacity="0.85"/>
  <text x="300" y="226" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8" fill="#000000" font-weight="700">ALERT 0.93</text>

  <!-- Alert triangle icon -->
  <g filter="url(#glow)" transform="translate(500,230)">
    <polygon points="0,-26 26,20 -26,20" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="7" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="1.8" fill="#ef4444"/>
  </g>

  <g stroke="#00ff41" stroke-opacity="0.25" fill="none" stroke-width="1">
    <polyline points="0,20 20,20 20,0"/>
    <polyline points="780,0 780,20 800,20"/>
    <polyline points="0,430 20,430 20,450"/>
    <polyline points="780,450 780,430 800,430"/>
  </g>

  <rect x="0" y="0" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">SECURITY_AI v1.0</text>
  <text x="660" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">MOVINET · LIVE</text>

  <rect x="0" y="428" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">FASTAPI · POSTGRESQL · DOCKER</text>
  <text x="700" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">CV_SECURITY</text>

  <text x="400" y="60" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="26" font-weight="700" fill="#00ff41" letter-spacing="2" filter="url(#glow-strong)">Shoplifting Detection</text>
  <text x="400" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#00ff41" fill-opacity="0.6" letter-spacing="2">REAL-TIME RETAIL ACTION RECOGNITION</text>

  <rect width="800" height="450" fill="url(#scanlines)"/>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
