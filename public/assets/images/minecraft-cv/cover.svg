<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="1" fill="#00ff41" fill-opacity="0.03"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <g stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Inventory slot grid -->
  <g transform="translate(400,225)" filter="url(#glow)">
    <g stroke="#00ff41" stroke-opacity="0.35" fill="none" stroke-width="1.5">
      <rect x="-135" y="-40" width="70" height="70"/>
      <rect x="-55" y="-40" width="70" height="70"/>
      <rect x="25" y="-40" width="70" height="70"/>
      <rect x="105" y="-40" width="70" height="70"/>
      <rect x="-135" y="40" width="70" height="70"/>
      <rect x="105" y="40" width="70" height="70"/>
    </g>

    <!-- Highlighted detection slot -->
    <rect x="-55" y="40" width="70" height="70" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-width="2.5"/>

    <!-- Pixel diamond gem (blocky, in highlighted slot) -->
    <g transform="translate(-20,75)">
      <rect x="-4" y="-24" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="4" y="-24" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="-12" y="-16" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="-4" y="-16" width="8" height="8" fill="#00ff41" fill-opacity="0.6"/>
      <rect x="4" y="-16" width="8" height="8" fill="#00ff41" fill-opacity="0.6"/>
      <rect x="12" y="-16" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="-12" y="-8" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="-4" y="-8" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="4" y="-8" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="12" y="-8" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="-4" y="0" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
      <rect x="4" y="0" width="8" height="8" fill="#00ff41" fill-opacity="0.9"/>
    </g>

    <!-- Extra empty pixel blocks scattered (other slots) -->
    <g fill="#00ff41" fill-opacity="0.3">
      <rect x="-115" y="-20" width="10" height="10"/>
      <rect x="-105" y="-10" width="10" height="10"/>
      <rect x="45" y="-20" width="10" height="10"/>
      <rect x="125" y="-20" width="10" height="10"/>
      <rect x="-115" y="60" width="10" height="10"/>
      <rect x="125" y="60" width="10" height="10"/>
    </g>

    <!-- Crosshair cursor -->
    <g stroke="#00ff41" stroke-width="1.5" filter="url(#glow)">
      <line x1="60" y1="-100" x2="60" y2="-86"/>
      <line x1="60" y1="-78" x2="60" y2="-64"/>
      <line x1="38" y1="-82" x2="52" y2="-82"/>
      <line x1="68" y1="-82" x2="82" y2="-82"/>
    </g>
  </g>

  <g stroke="#00ff41" stroke-opacity="0.25" fill="none" stroke-width="1">
    <polyline points="0,20 20,20 20,0"/>
    <polyline points="780,0 780,20 800,20"/>
    <polyline points="0,430 20,430 20,450"/>
    <polyline points="780,450 780,430 800,430"/>
  </g>

  <rect x="0" y="0" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">MC_CV_BOT v1.0</text>
  <text x="670" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">TEMPLATE MATCH</text>

  <rect x="0" y="428" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">HSV DETECTION · GLOBAL HOTKEYS</text>
  <text x="700" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">SIDE_PROJECT</text>

  <text x="400" y="60" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="30" font-weight="700" fill="#00ff41" letter-spacing="3" filter="url(#glow-strong)">Minecraft CV</text>
  <text x="400" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#00ff41" fill-opacity="0.6" letter-spacing="2">SCREEN-CAPTURE AFK AUTOMATION</text>

  <rect width="800" height="450" fill="url(#scanlines)"/>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
