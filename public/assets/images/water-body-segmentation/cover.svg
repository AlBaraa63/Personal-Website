<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="1" fill="#00ff41" fill-opacity="0.03"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <g stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Satellite -->
  <g transform="translate(255,150)" filter="url(#glow)" stroke="#00ff41" stroke-width="1.5" fill="none">
    <rect x="-12" y="-12" width="24" height="24" fill="#00ff41" fill-opacity="0.12"/>
    <rect x="-46" y="-6" width="26" height="12" fill="#00ff41" fill-opacity="0.15"/>
    <rect x="20" y="-6" width="26" height="12" fill="#00ff41" fill-opacity="0.15"/>
    <line x1="-20" y1="-6" x2="-20" y2="6"/>
    <line x1="20" y1="-6" x2="20" y2="6"/>
    <line x1="0" y1="12" x2="0" y2="26"/>
  </g>

  <!-- Scan beam down to landmass -->
  <polygon points="255,165 190,300 320,300" fill="#00ff41" fill-opacity="0.04" stroke="#00ff41" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Landmass with water body mask -->
  <g transform="translate(400,300)" filter="url(#glow)">
    <path d="M-220,60 Q-160,20 -90,35 Q-10,10 60,30 Q140,15 220,55 L220,90 L-220,90 Z" fill="#00ff41" fill-opacity="0.06" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Water body mask (segmented) -->
    <path d="M-140,45 Q-90,25 -40,42 Q10,55 60,38 Q100,50 110,65 Q40,80 -60,75 Q-130,70 -140,45 Z"
          fill="#06b6d4" fill-opacity="0.28" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="5,3"/>
  </g>

  <!-- IoU label -->
  <rect x="330" y="330" width="140" height="16" fill="#00ff41" fill-opacity="0.85"/>
  <text x="336" y="342" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#000000" font-weight="700">WATER MASK · IoU 0.854</text>

  <!-- Grid overlay hint on landmass area -->
  <g stroke="#00ff41" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="220" y1="260" x2="220" y2="380"/>
    <line x1="330" y1="260" x2="330" y2="380"/>
    <line x1="470" y1="260" x2="470" y2="380"/>
    <line x1="580" y1="260" x2="580" y2="380"/>
  </g>

  <g stroke="#00ff41" stroke-opacity="0.25" fill="none" stroke-width="1">
    <polyline points="0,20 20,20 20,0"/>
    <polyline points="780,0 780,20 800,20"/>
    <polyline points="0,430 20,430 20,450"/>
    <polyline points="780,450 780,430 800,430"/>
  </g>

  <rect x="0" y="0" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">AQUA_SEG v1.0</text>
  <text x="640" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">MiT-B2 · 0.854 IoU</text>

  <rect x="0" y="428" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">12-BAND SENTINEL-2 · GEOTIFF · FLASK</text>
  <text x="720" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">REMOTE_AI</text>

  <text x="400" y="60" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="700" fill="#00ff41" letter-spacing="2" filter="url(#glow-strong)">Water Body Segmentation</text>
  <text x="400" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#00ff41" fill-opacity="0.6" letter-spacing="2">SENTINEL-2 SATELLITE SEGMENTATION</text>

  <rect width="800" height="450" fill="url(#scanlines)"/>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
