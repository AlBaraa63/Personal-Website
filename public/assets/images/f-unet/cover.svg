<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="1" fill="#00ff41" fill-opacity="0.03"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- U-Net encoder-decoder schematic -->
  <g filter="url(#glow)" stroke="#00ff41" fill="none" stroke-width="1.5">
    <!-- Encoder staircase (down) -->
    <rect x="150" y="130" width="70" height="42" stroke-opacity="0.9"/>
    <rect x="235" y="178" width="60" height="38" stroke-opacity="0.85"/>
    <rect x="310" y="222" width="50" height="34" stroke-opacity="0.8"/>
    <!-- Bottleneck -->
    <rect x="375" y="258" width="50" height="40" stroke-opacity="1" fill="#00ff41" fill-opacity="0.12"/>
    <!-- Decoder staircase (up) -->
    <rect x="440" y="222" width="50" height="34" stroke-opacity="0.8"/>
    <rect x="505" y="178" width="60" height="38" stroke-opacity="0.85"/>
    <rect x="580" y="130" width="70" height="42" stroke-opacity="0.9"/>

    <!-- Path connectors -->
    <path d="M220,151 L235,197" stroke-opacity="0.6"/>
    <path d="M295,197 L310,239" stroke-opacity="0.6"/>
    <path d="M360,239 L375,278" stroke-opacity="0.6"/>
    <path d="M425,278 L440,239" stroke-opacity="0.6"/>
    <path d="M490,239 L505,197" stroke-opacity="0.6"/>
    <path d="M565,197 L580,151" stroke-opacity="0.6"/>
  </g>

  <!-- Skip connections with attention-gate markers -->
  <g stroke="#00ff41" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4,3">
    <line x1="220" y1="151" x2="580" y2="151"/>
    <line x1="265" y1="197" x2="535" y2="197"/>
    <line x1="335" y1="239" x2="465" y2="239"/>
  </g>
  <g fill="#00ff41" filter="url(#glow)">
    <polygon points="400,145 408,151 400,157 392,151" fill-opacity="0.9"/>
    <polygon points="400,191 408,197 400,203 392,197" fill-opacity="0.9"/>
    <polygon points="400,233 408,239 400,245 392,239" fill-opacity="0.9"/>
  </g>

  <!-- HUD corner decorations -->
  <g stroke="#00ff41" stroke-opacity="0.25" fill="none" stroke-width="1">
    <polyline points="0,20 20,20 20,0"/>
    <polyline points="780,0 780,20 800,20"/>
    <polyline points="0,430 20,430 20,450"/>
    <polyline points="780,450 780,430 800,430"/>
  </g>

  <!-- Top status bar -->
  <rect x="0" y="0" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">FUNET_FRAMEWORK v1.0</text>
  <text x="640" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">SRC2026 · POSTER</text>

  <!-- Bottom bar -->
  <rect x="0" y="428" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">8 CONFIGS · A0-A7 · 82% SMALLER</text>
  <text x="700" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">PYTORCH</text>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="32" font-weight="700" fill="#00ff41" letter-spacing="4" filter="url(#glow-strong)">F-UNet</text>
  <text x="400" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#00ff41" fill-opacity="0.6" letter-spacing="2">MODULAR ENCODER-DECODER SEGMENTATION</text>

  <rect width="800" height="450" fill="url(#scanlines)"/>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
