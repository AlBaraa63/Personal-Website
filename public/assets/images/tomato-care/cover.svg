<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="1" fill="#00ff41" fill-opacity="0.03"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <g stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Phone body -->
  <g filter="url(#glow)">
    <rect x="320" y="115" width="160" height="255" rx="16" fill="none" stroke="#00ff41" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="332" y="135" width="136" height="190" fill="#00ff41" fill-opacity="0.05" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="380" y1="345" x2="420" y2="345" stroke="#00ff41" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Leaf inside phone screen -->
  <g transform="translate(400,225)" filter="url(#glow)">
    <path d="M0,-55 C40,-40 55,0 0,60 C-55,0 -40,-40 0,-55 Z" fill="#00ff41" fill-opacity="0.14" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.85"/>
    <path d="M0,-50 L0,55" stroke="#00ff41" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M0,-20 L-20,-5 M0,0 L22,15 M0,25 L-18,38" stroke="#00ff41" stroke-opacity="0.4" stroke-width="0.8"/>
    <!-- Disease spots -->
    <circle cx="-14" cy="-8" r="4" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="16" cy="18" r="5" fill="#f59e0b" fill-opacity="0.7"/>
    <circle cx="-8" cy="30" r="3" fill="#ef4444" fill-opacity="0.7"/>
  </g>

  <!-- Detection frame around leaf -->
  <g stroke="#00ff41" fill="none" stroke-opacity="0.7" stroke-width="1.5">
    <polyline points="345,155 345,140 360,140"/>
    <polyline points="455,140 455,155"/>
    <polyline points="345,295 345,310 360,310"/>
    <polyline points="455,310 455,295"/>
  </g>
  <rect x="345" y="150" width="82" height="14" fill="#00ff41" fill-opacity="0.85"/>
  <text x="349" y="160" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8" fill="#000000" font-weight="600">BLIGHT 0.91</text>

  <!-- Bilingual toggle chips -->
  <g filter="url(#glow)">
    <rect x="345" y="325" width="36" height="14" rx="2" fill="none" stroke="#00ff41" stroke-opacity="0.6" stroke-width="1"/>
    <text x="352" y="335" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00ff41" fill-opacity="0.8">EN</text>
    <rect x="419" y="325" width="36" height="14" rx="2" fill="none" stroke="#00ff41" stroke-opacity="0.6" stroke-width="1"/>
    <text x="428" y="335" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00ff41" fill-opacity="0.8">AR</text>
  </g>

  <g stroke="#00ff41" stroke-opacity="0.25" fill="none" stroke-width="1">
    <polyline points="0,20 20,20 20,0"/>
    <polyline points="780,0 780,20 800,20"/>
    <polyline points="0,430 20,430 20,450"/>
    <polyline points="780,450 780,430 800,430"/>
  </g>

  <rect x="0" y="0" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">TOMATOCARE v1.0</text>
  <text x="660" y="14" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">ANDROID · TFLITE</text>

  <rect x="0" y="428" width="800" height="22" fill="#00ff41" fill-opacity="0.04"/>
  <text x="16" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">9.87MB · 12-20MS ON-DEVICE INFERENCE</text>
  <text x="710" y="442" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#00ff41" fill-opacity="0.5" letter-spacing="1">EDGE_AI</text>

  <text x="400" y="60" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="30" font-weight="700" fill="#00ff41" letter-spacing="3" filter="url(#glow-strong)">TomatoCare</text>
  <text x="400" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#00ff41" fill-opacity="0.6" letter-spacing="2">OFFLINE BILINGUAL DISEASE DETECTION</text>

  <rect width="800" height="450" fill="url(#scanlines)"/>
  <rect width="800" height="450" fill="url(#vignette)"/>
</svg>
